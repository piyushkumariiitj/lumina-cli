<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS/Compile → orbital-cli readiness</title>
<style>
:root{
  --bg:#0b0e14;
  --bg-panel:#11151f;
  --bg-panel-2:#161b27;
  --line:#242b3a;
  --ink:#e9edf5;
  --muted:#8993ab;
  --muted-2:#5c6580;
  --blue:#5b9dff;
  --blue-dim:#5b9dff33;
  --green:#3ecf8e;
  --green-dim:#3ecf8e22;
  --red:#ff6b6b;
  --red-dim:#ff6b6b22;
  --amber:#f5b942;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Sora','Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
::selection{background:var(--blue-dim);color:var(--ink);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#2a3142;border-radius:6px;}

a{color:var(--blue);}

.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh;}
@media (max-width:900px){.layout{grid-template-columns:1fr;}}

/* ---------- Sidebar ---------- */
.sidebar{
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg-panel),var(--bg));
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:20px 14px 40px;
}
@media (max-width:900px){
  .sidebar{position:relative;height:auto;max-height:70vh;}
}
.brand{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  padding:6px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;
  line-height:1.6;
}
.brand .prompt{color:var(--green);}
.brand .path{color:var(--blue);}
.brand strong{color:var(--ink);font-weight:600;}

.progress-wrap{padding:0 10px 16px;}
.progress-label{font-size:11px;color:var(--muted-2);font-family:var(--mono);margin-bottom:6px;display:flex;justify-content:space-between;}
.progress-bar{height:5px;background:var(--line);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0%;transition:width .4s ease;}

.navlist{list-style:none;margin:0;padding:0;}
.navlist li{margin-bottom:2px;}
.navbtn{
  width:100%;text-align:left;background:transparent;border:1px solid transparent;
  color:var(--muted);font-family:var(--sans);font-size:13.5px;padding:9px 10px;
  border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;
  transition:background .15s, color .15s, border-color .15s;
}
.navbtn .num{font-family:var(--mono);font-size:11px;color:var(--muted-2);width:20px;flex:none;}
.navbtn:hover{background:var(--bg-panel-2);color:var(--ink);}
.navbtn.active{background:var(--blue-dim);color:var(--ink);border-color:#5b9dff44;}
.navbtn.active .num{color:var(--blue);}
.navbtn.done .num::after{content:'';}
.navbtn .check{margin-left:auto;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted-2);flex:none;}
.navbtn.done .check{background:var(--green);border-color:var(--green);}

.navsection-title{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted-2);padding:16px 10px 6px;
}

/* ---------- Main ---------- */
.main{padding:0;min-width:0;}
.page{display:none;padding:48px clamp(20px,4vw,64px) 100px;max-width:920px;}
.page.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.eyebrow{font-family:var(--mono);font-size:12px;color:var(--blue);letter-spacing:.06em;margin-bottom:10px;text-transform:uppercase;}
h1{font-family:var(--sans);font-size:clamp(28px,4vw,40px);margin:0 0 12px;font-weight:700;letter-spacing:-.01em;}
.subtitle{color:var(--muted);font-size:16px;line-height:1.65;max-width:70ch;margin-bottom:6px;}

.hing{
  background:var(--bg-panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:10px;padding:16px 18px;margin:22px 0;font-size:15px;line-height:1.75;color:#dfe4ee;
}
.hing b{color:var(--amber);}

h2{font-size:21px;margin:36px 0 12px;font-weight:650;display:flex;align-items:center;gap:10px;}
h2 .tag{font-family:var(--mono);font-size:11px;color:var(--muted-2);border:1px solid var(--line);padding:2px 7px;border-radius:5px;}
h3{font-size:16px;margin:22px 0 8px;color:var(--ink);font-weight:650;}
p{line-height:1.75;color:#cfd5e3;font-size:15px;}
ul,ol{line-height:1.8;color:#cfd5e3;font-size:15px;padding-left:22px;}
li{margin-bottom:4px;}
code.inline{
  font-family:var(--mono);background:#1c2231;border:1px solid var(--line);padding:1.5px 6px;
  border-radius:5px;font-size:13px;color:var(--green);
}

/* code blocks */
pre{
  background:#0d111a;border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.65;margin:14px 0;
}
pre code{font-family:var(--mono);color:#d7dced;white-space:pre;}
.kw{color:#c792ea;} .ty{color:#5b9dff;} .str{color:#3ecf8e;} .cm{color:#5c6580;font-style:italic;} .fn{color:#f5b942;} .num{color:#ff9e64;}

/* diff blocks */
.diffwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
@media (max-width:700px){.diffwrap{grid-template-columns:1fr;}}
.diffcol{border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.diffhead{font-family:var(--mono);font-size:11px;padding:8px 12px;letter-spacing:.04em;text-transform:uppercase;}
.diffhead.bad{background:var(--red-dim);color:var(--red);}
.diffhead.good{background:var(--green-dim);color:var(--green);}
.diffcol pre{border:none;border-radius:0;margin:0;}
.diffcol.bad pre{border-left:3px solid var(--red);}
.diffcol.good pre{border-left:3px solid var(--green);}

/* info cards row: why / where / mistakes */
.cardrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:20px 0 8px;}
@media (max-width:700px){.cardrow{grid-template-columns:1fr;}}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.card .clabel{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.card.why .clabel{color:var(--blue);}
.card.where .clabel{color:var(--green);}
.card.mistake .clabel{color:var(--red);}
.card p, .card ul{font-size:13.5px;margin:0;color:#c3c9d8;}
.card ul{padding-left:16px;}

/* flip cards for "recognize this syntax" */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:18px 0;}
.flipcard{perspective:1000px;height:130px;cursor:pointer;}
.flipinner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flipcard.flipped .flipinner{transform:rotateY(180deg);}
.flipface{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid var(--line);padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;}
.flipfront{background:#0d111a;font-family:var(--mono);font-size:13px;color:var(--blue);}
.flipback{background:var(--bg-panel-2);transform:rotateY(180deg);font-size:13px;color:#cfd5e3;line-height:1.5;}
.fliphint{position:absolute;bottom:6px;right:8px;font-size:9px;color:var(--muted-2);font-family:var(--mono);}

/* quiz */
.quiz{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:22px 0;}
.quiz .qlabel{font-family:var(--mono);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.quiz-options{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 10px;}
.qopt{background:#0d111a;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:var(--mono);}
.qopt:hover{border-color:var(--blue);}
.qopt.correct{border-color:var(--green);background:var(--green-dim);}
.qopt.wrong{border-color:var(--red);background:var(--red-dim);}
.qanswer{display:none;font-size:13.5px;color:#cfd5e3;border-top:1px solid var(--line);padding-top:10px;margin-top:6px;}
.qanswer.show{display:block;}

/* tables */
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px;}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;}
th{background:var(--bg-panel-2);font-family:var(--mono);font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;}
td code.inline{white-space:nowrap;}

/* hero (intro page) */
.hero-term{
  background:#0d111a;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:26px 0 10px;
  box-shadow:0 20px 60px -20px #000a;
}
.hero-term .tbar{display:flex;gap:6px;padding:10px 14px;background:#151a26;border-bottom:1px solid var(--line);}
.tbar span{width:10px;height:10px;border-radius:50%;display:inline-block;}
.tbar .c1{background:#ff5f56;} .tbar .c2{background:#febc2e;} .tbar .c3{background:#28c840;}
.tbar .fname{margin-left:10px;font-family:var(--mono);font-size:11px;color:var(--muted);}
.hero-term pre{border:none;border-radius:0;margin:0;padding:20px 22px;}

.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;}
.pill{font-family:var(--mono);font-size:11.5px;background:var(--bg-panel-2);border:1px solid var(--line);padding:5px 11px;border-radius:20px;color:var(--muted);}

.stepgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0;}
@media (max-width:700px){.stepgrid{grid-template-columns:1fr;}}
.stepcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s;}
.stepcard:hover{border-color:var(--blue);transform:translateY(-2px);}
.stepcard .n{font-family:var(--mono);color:var(--muted-2);font-size:11px;}
.stepcard .t{font-size:14.5px;font-weight:600;margin-top:4px;}

/* checklist (7-day plan) */
.daycard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
.daycard h3{margin-top:0;display:flex;align-items:center;justify-content:space-between;}
.daycard h3 .dtag{font-family:var(--mono);font-size:11px;color:var(--blue);border:1px solid #5b9dff44;padding:3px 9px;border-radius:20px;}
.tasklist{list-style:none;padding:0;margin:10px 0 0;}
.tasklist li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;color:#cfd5e3;}
.tasklist input{margin-top:3px;accent-color:var(--green);width:15px;height:15px;flex:none;cursor:pointer;}
.tasklist label{cursor:pointer;}
.tasklist input:checked + label{color:var(--muted-2);text-decoration:line-through;}

.footer-nav{display:flex;justify-content:space-between;margin-top:56px;padding-top:20px;border-top:1px solid var(--line);}
.footer-nav button{
  background:var(--bg-panel);border:1px solid var(--line);color:var(--ink);padding:10px 16px;
  border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13.5px;display:flex;align-items:center;gap:8px;
}
.footer-nav button:hover{border-color:var(--blue);}
.footer-nav .muted-txt{color:var(--muted-2);font-family:var(--mono);font-size:11px;}

.mobiletoggle{display:none;}
@media (max-width:900px){
  .mobiletoggle{
    display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg-panel);
    border-bottom:1px solid var(--line);padding:12px 16px;font-family:var(--mono);font-size:12px;color:var(--blue);cursor:pointer;
  }
}
</style>
</head>
<body>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <span class="prompt">$</span> npx <strong>ts-roadmap</strong> --for <span class="path">orbital-cli-dev</span><br>
      <span style="color:var(--muted-2)">// JS दिमाग से TS समझने का रास्ता</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>PROGRESS</span><span id="progressPct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <ul class="navlist" id="navlist"></ul>
  </nav>

  <main class="main">
    <div class="mobiletoggle" onclick="document.getElementById('sidebar').scrollIntoView()">☰ Jump to section list ↑</div>
    <div id="pages"></div>
  </main>
</div>

<script>
/* ============================================================
   SECTION DATA — order matters, drives sidebar + progress
   ============================================================ */
const SECTIONS = [
  {id:'intro', num:'00', title:'Start Here'},
  {id:'fundamentals', num:'01', title:'TS Fundamentals'},
  {id:'objects', num:'02', title:'Objects & Data Modeling'},
  {id:'functions', num:'03', title:'Functions'},
  {id:'advanced', num:'04', title:'Generics & Utility Types'},
  {id:'classes', num:'05', title:'Classes & OOP'},
  {id:'modules', num:'06', title:'Modules & Project Structure'},
  {id:'node', num:'07', title:'TypeScript + Node.js'},
  {id:'errors', num:'08', title:'Error Handling'},
  {id:'thirdparty', num:'09', title:'Third-Party Typing'},
  {id:'aiagent', num:'10', title:'AI Agent Patterns'},
  {id:'prisma', num:'11', title:'Prisma + TypeScript'},
  {id:'auth', num:'12', title:'Auth Patterns'},
  {id:'cheatsheet', num:'13', title:'Cheat Sheet'},
  {id:'recognize', num:'14', title:'Recognize-on-Sight'},
  {id:'plan', num:'15', title:'7-Day Plan'},
];

let current = 0;
const visited = new Set();

function buildNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = SECTIONS.map((s,i)=>`
    <li>
      <button class="navbtn" data-i="${i}" onclick="goTo(${i})">
        <span class="num">${s.num}</span>
        <span>${s.title}</span>
        <span class="check"></span>
      </button>
    </li>`).join('');
}

function goTo(i){
  current = i;
  visited.add(i);
  document.querySelectorAll('.page').forEach((p,idx)=>p.classList.toggle('active', idx===i));
  document.querySelectorAll('.navbtn').forEach((b)=>{
    const idx = +b.dataset.i;
    b.classList.toggle('active', idx===i);
    if(visited.has(idx)) b.classList.add('done');
  });
  updateProgress();
  window.scrollTo({top:0,behavior:'instant'});
}

function updateProgress(){
  const pct = Math.round((visited.size / SECTIONS.length) * 100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
}

function footerNav(i){
  const prev = SECTIONS[i-1];
  const next = SECTIONS[i+1];
  return `<div class="footer-nav">
    ${prev ? `<button onclick="goTo(${i-1})">← <span>${prev.title}</span></button>` : `<span></span>`}
    ${next ? `<button onclick="goTo(${i+1})"><span>${next.title}</span> →</button>` : `<span class="muted-txt">End of roadmap 🎉</span>`}
  </div>`;
}

function flip(el){ el.classList.toggle('flipped'); }

function answerQuiz(btn, correct, groupId){
  const group = document.querySelectorAll(`.qopt[data-group="${groupId}"]`);
  group.forEach(b=>b.classList.remove('correct','wrong'));
  if(btn.dataset.correct === 'true'){ btn.classList.add('correct'); }
  else { btn.classList.add('wrong'); }
  document.getElementById('ans-'+groupId).classList.add('show');
}

/* ============================================================
   PAGE CONTENT
   ============================================================ */
const pages = document.getElementById('pages');

pages.innerHTML = `

<!-- 00 INTRO -->
<section class="page" id="page-intro">
  <div class="eyebrow">Section 00 / Orientation</div>
  <h1>You know JS. You're about to read a TS codebase.</h1>
  <p class="subtitle">Yeh guide sirf woh TypeScript sikhaati hai jo <b>orbital-cli-dev</b> jaise Node.js AI Agent CLI project ko padhne aur modify karne ke liye chahiye — koi generic "TS for beginners" course nahi.</p>

  <div class="hero-term">
    <div class="tbar"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="fname">geminiService.js  vs  geminiService.ts</span></div>
    <div class="diffwrap" style="margin:0;">
      <div class="diffcol bad">
        <div class="diffhead bad">JS — runs, then explodes</div>
        <pre><code><span class="kw">function</span> <span class="fn">callGemini</span>(prompt) {
  <span class="kw">return</span> model.generate(prompt.text)
  <span class="cm">// prompt.text is undefined —</span>
  <span class="cm">// you only find out at runtime,</span>
  <span class="cm">// in front of a user, in prod.</span>
}</code></pre>
      </div>
      <div class="diffcol good">
        <div class="diffhead good">TS — red squiggle before you even run it</div>
        <pre><code><span class="kw">function</span> <span class="fn">callGemini</span>(prompt<span class="ty">: string</span>)<span class="ty">: Promise&lt;string&gt;</span> {
  <span class="kw">return</span> model.generate(prompt)
  <span class="cm">// prompt.text → compile error:</span>
  <span class="cm">// Property 'text' does not exist</span>
  <span class="cm">// on type 'string'.</span>
}</code></pre>
      </div>
    </div>
  </div>

  <p>Yehi TypeScript ka pura point hai: <b>errors ko runtime se compile-time pe le aana.</b> Baaki sab (interfaces, generics, decorators) is ek idea ke upar bane hue tools hain.</p>

  <div class="pillrow">
    <span class="pill">You already know: variables, functions, async/await, classes, npm</span>
    <span class="pill">This guide adds: the type layer on top</span>
  </div>

  <h2>How to use this page <span class="tag">read once</span></h2>
  <div class="stepgrid">
    <div class="stepcard" onclick="goTo(1)"><div class="n">01→12</div><div class="t">Read topics in order — each builds on the last</div></div>
    <div class="stepcard" onclick="goTo(13)"><div class="n">13</div><div class="t">Cheat sheet — bookmark this while reading the repo</div></div>
    <div class="stepcard" onclick="goTo(15)"><div class="n">15</div><div class="t">7-day plan — do this before writing code</div></div>
  </div>

  <h2>Every topic follows the same shape</h2>
  <div class="cardrow">
    <div class="card why"><div class="clabel">① Why it exists</div><p>The JS pain point it solves</p></div>
    <div class="card where"><div class="clabel">② Where in the repo</div><p>The actual file/pattern you'll see</p></div>
    <div class="card mistake"><div class="clabel">③ Common mistake</div><p>What trips up JS devs specifically</p></div>
  </div>

  ${footerNav(0)}
</section>

<!-- 01 FUNDAMENTALS -->
<section class="page" id="page-fundamentals">
  <div class="eyebrow">Section 01 / Foundations</div>
  <h1>TypeScript Fundamentals</h1>
  <p class="subtitle">TypeScript = JavaScript + a type-checker that runs before your code runs. It compiles down to plain JS — the browser/Node never sees a single type.</p>

  <div class="hing"><b>Hinglish:</b> Socho JS ek aisa waiter hai jo koi bhi order le leta hai bina check kiye — chahe tum "do plate hawa" bhi order karo, woh kitchen tak bhej dega, aur crash wahi hoga. TypeScript ek strict waiter hai jo order lene se pehle hi bol dega "bhai yeh menu mein nahi hai." Bade projects mein (jaise ek AI agent jisme 10+ tools, services, DB models hain) yeh "pehle hi bata do" wala behavior lifesaver hai.</div>

  <h2>Why TS over JS in large projects</h2>
  <ul>
    <li><b>Compile-time safety:</b> typos aur wrong-shape data pakde jaate hain editor mein hi, deploy se pehle.</li>
    <li><b>Self-documenting:</b> <code class="inline">function executeTool(tool: Tool): Promise&lt;ToolResult&gt;</code> khud bata deta hai kya jaata hai, kya aata hai — no need to read the whole function body.</li>
    <li><b>Refactor confidence:</b> Agent config ka shape badla? TS turant bata dega saare jagah jahan tumhe update karna hai.</li>
    <li><b>Autocomplete that's actually correct:</b> editor ko pata hota hai <code class="inline">agent.tools[0].</code> ke baad kya properties available hain.</li>
  </ul>

  <h3>Type annotations & primitive types</h3>
  <pre><code><span class="kw">let</span> agentName<span class="ty">: string</span> = <span class="str">"Orbital"</span>;
<span class="kw">let</span> maxTokens<span class="ty">: number</span> = <span class="num">4096</span>;
<span class="kw">let</span> isStreaming<span class="ty">: boolean</span> = <span class="kw">false</span>;
<span class="kw">let</span> tags<span class="ty">: string[]</span> = [<span class="str">"cli"</span>, <span class="str">"ai"</span>];
<span class="kw">let</span> anything<span class="ty">: any</span> = <span class="num">42</span>; <span class="cm">// escape hatch — avoid</span></code></pre>

  <h3>Type inference — you don't always need to write types</h3>
  <p>TS aksar khud figure kar leta hai type, agar tum initial value de do. Har jagah annotation likhna zaroori nahi.</p>
  <pre><code><span class="kw">let</span> retries = <span class="num">3</span>;         <span class="cm">// inferred: number — no ": number" needed</span>
<span class="kw">const</span> model = <span class="str">"gemini-1.5-flash"</span>; <span class="cm">// inferred: literal type "gemini-1.5-flash"</span></code></pre>

  <h3><code class="inline">any</code> vs <code class="inline">unknown</code> — the interview-favourite question</h3>
  <div class="diffwrap">
    <div class="diffcol bad">
      <div class="diffhead bad">any — turns TS off</div>
      <pre><code><span class="kw">function</span> <span class="fn">handleResponse</span>(res<span class="ty">: any</span>) {
  <span class="kw">return</span> res.data.choices[<span class="num">0</span>].text;
  <span class="cm">// no error even if wrong shape —</span>
  <span class="cm">// crashes later at runtime</span>
}</code></pre>
    </div>
    <div class="diffcol good">
      <div class="diffhead good">unknown — forces you to check</div>
      <pre><code><span class="kw">function</span> <span class="fn">handleResponse</span>(res<span class="ty">: unknown</span>) {
  <span class="kw">if</span> (<span class="kw">typeof</span> res === <span class="str">"object"</span> && res !== <span class="kw">null</span> && <span class="str">"data"</span> <span class="kw">in</span> res) {
    <span class="cm">// only NOW can you access res.data</span>
  }
}</code></pre>
    </div>
  </div>
  <p>Gemini/OpenAI se aane wala raw API response almost hamesha <code class="inline">unknown</code> hona chahiye jab tak tum use validate (Zod) na kar lo. <code class="inline">any</code> use karna matlab TypeScript ko us variable ke liye "band" kar dena — future me bugs chhupte hain.</p>

  <h3><code class="inline">void</code> and <code class="inline">never</code></h3>
  <pre><code><span class="kw">function</span> <span class="fn">logToolCall</span>(name<span class="ty">: string</span>)<span class="ty">: void</span> { <span class="cm">// returns nothing</span>
  console.log(<span class="str">\`Calling tool: \${name}\`</span>);
}

<span class="kw">function</span> <span class="fn">throwConfigError</span>(msg<span class="ty">: string</span>)<span class="ty">: never</span> { <span class="cm">// never returns at all</span>
  <span class="kw">throw new</span> Error(msg);
}</code></pre>
  <p><code class="inline">void</code> = "kuch return nahi hoga" (par function normally khatam hota hai). <code class="inline">never</code> = "yeh function kabhi normally return hi nahi karega" (hamesha throw karta hai, ya infinite loop). CLI tools mein <code class="inline">never</code> aksar fatal-error exit functions ke liye milta hai.</p>

  <h3>null and undefined handling</h3>
  <pre><code><span class="kw">interface</span> AgentConfig {
  apiKey<span class="ty">: string</span>;
  systemPrompt<span class="ty">?: string</span>;  <span class="cm">// optional → could be undefined</span>
}

<span class="kw">function</span> <span class="fn">getPrompt</span>(cfg<span class="ty">: AgentConfig</span>)<span class="ty">: string</span> {
  <span class="kw">return</span> cfg.systemPrompt ?? <span class="str">"You are a helpful agent."</span>; <span class="cm">// nullish coalescing</span>
}</code></pre>
  <p><code class="inline">strictNullChecks</code> (usually on by default in modern <code class="inline">tsconfig.json</code>) ka matlab: agar kisi variable mein <code class="inline">null</code>/<code class="inline">undefined</code> aa sakta hai, TS tumhe use se pehle check karwayega. <code class="inline">?.</code> (optional chaining) aur <code class="inline">??</code> (nullish coalescing) yahi handle karte hain.</p>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>JS ke "undefined is not a function" jaise crashes ko runtime se compile-time laane ke liye.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p>Almost every function signature, especially around config, env vars aur API responses.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><ul><li>Har jagah <code class="inline">any</code> laga dena "compile ho jaaye" ke liye</li><li><code class="inline">unknown</code> ko access karne se pehle narrow na karna</li></ul></div>
  </div>

  <div class="quiz">
    <div class="qlabel">Quick check</div>
    <p>Ek function <code class="inline">fetch()</code> se aaya JSON response handle kar raha hai jiska shape tumhe pehle se pata nahi. Sabse safe parameter type kaunsa hai?</p>
    <div class="quiz-options">
      <button class="qopt" data-group="q1" data-correct="false" onclick="answerQuiz(this,false,'q1')">any</button>
      <button class="qopt" data-group="q1" data-correct="true" onclick="answerQuiz(this,true,'q1')">unknown</button>
      <button class="qopt" data-group="q1" data-correct="false" onclick="answerQuiz(this,false,'q1')">object</button>
    </div>
    <div class="qanswer" id="ans-q1"><b>unknown</b> is correct. Yeh tumhe access se pehle type check/narrow karne ke liye force karta hai — <code class="inline">any</code> silently sab allow kar deta hai.</div>
  </div>

  ${footerNav(1)}
</section>

<!-- 02 OBJECTS -->
<section class="page" id="page-objects">
  <div class="eyebrow">Section 02 / The most important section</div>
  <h1>Objects & Data Modeling</h1>
  <p class="subtitle">Ek AI agent CLI mein sabse zyada TS jo dikhega woh <b>shapes describe karna hai</b> — User, Tool, AgentConfig, API response. Yeh section 60% of what you'll read in the repo covers.</p>

  <div class="hing"><b>Hinglish:</b> Interface ya type ek "blueprint" hai — jaise ek form jisme fields defined hain. Jab bhi tum koi object banaoge (jaise ek tool ya agent config), TS check karega ki woh us blueprint se match karta hai ya nahi.</div>

  <h3>Interfaces — the primary way to describe object shapes</h3>
  <pre><code><span class="kw">interface</span> User {
  id<span class="ty">: string</span>;
  email<span class="ty">: string</span>;
  name<span class="ty">?: string</span>;          <span class="cm">// optional property</span>
  <span class="kw">readonly</span> createdAt<span class="ty">: Date</span>; <span class="cm">// can't be reassigned after creation</span>
}</code></pre>

  <h3>Type aliases — same job, different keyword</h3>
  <pre><code><span class="kw">type</span> Role = <span class="str">"user"</span> | <span class="str">"assistant"</span> | <span class="str">"system"</span> | <span class="str">"tool"</span>; <span class="cm">// union type</span>

<span class="kw">type</span> ChatMessage = {
  role<span class="ty">: Role</span>;
  content<span class="ty">: string</span>;
};</code></pre>
  <p><b>Interface vs type — jab confuse ho:</b> object shapes ke liye dono kaam karte hain. Repo mein rule of thumb: <code class="inline">interface</code> jab shape ko baad mein extend karna ho (services, entities), <code class="inline">type</code> jab union/intersection banana ho (roles, statuses, tool names).</p>

  <h3>Nested objects, extending, intersection & union</h3>
  <div class="diffwrap">
    <div class="diffcol good">
      <div class="diffhead good">Extending an interface</div>
      <pre><code><span class="kw">interface</span> BaseTool {
  name<span class="ty">: string</span>;
  description<span class="ty">: string</span>;
}

<span class="kw">interface</span> ExecutableTool <span class="kw">extends</span> BaseTool {
  execute(input<span class="ty">: unknown</span>)<span class="ty">: Promise&lt;string&gt;</span>;
}</code></pre>
    </div>
    <div class="diffcol good">
      <div class="diffhead good">Nested object + AgentConfig</div>
      <pre><code><span class="kw">interface</span> AgentConfig {
  goal<span class="ty">: string</span>;
  tools<span class="ty">: ExecutableTool[]</span>;
  memory<span class="ty">: {</span>
    <span class="ty">shortTerm: ChatMessage[];</span>
    <span class="ty">maxItems: number;</span>
  <span class="ty">}</span>;
}</code></pre>
    </div>
  </div>

  <pre><code><span class="cm">// Intersection: combine two shapes into one ("must satisfy BOTH")</span>
<span class="kw">type</span> AuthedUser = User & { token<span class="ty">: string</span> };

<span class="cm">// Union: value can be ONE of several shapes</span>
<span class="kw">type</span> ApiResponse =
  | { status<span class="ty">: "success"</span>; data<span class="ty">: string</span> }
  | { status<span class="ty">: "error"</span>; message<span class="ty">: string</span> };

<span class="kw">function</span> <span class="fn">handle</span>(res<span class="ty">: ApiResponse</span>) {
  <span class="kw">if</span> (res.status === <span class="str">"success"</span>) {
    console.log(res.data);    <span class="cm">// TS knows .data exists here</span>
  } <span class="kw">else</span> {
    console.log(res.message); <span class="cm">// and .message exists here</span>
  }
}</code></pre>
  <p>Yeh pattern (union + <code class="inline">if (res.status === ...)</code> check) ko <b>discriminated union</b> kehte hain — Gemini/OpenAI API responses aur tool results handle karne ka sabse common TS pattern hai yeh, especially jab success/error states alag shapes rakhte hain.</p>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>Plain JS objects ka koi "contract" nahi hota — koi bhi property missing/extra ho sakti hai chupke se. Interfaces yeh contract enforce karte hain.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">types.ts</code> / <code class="inline">interfaces.ts</code> files, tool definitions, agent config, API response types.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><ul><li>Optional (<code class="inline">?</code>) aur undefined-allowed (<code class="inline">| undefined</code>) ko same samajh lena</li><li>Discriminated union ka discriminant field check kiye bina property access karna</li></ul></div>
  </div>

  ${footerNav(2)}
</section>

<!-- 03 FUNCTIONS -->
<section class="page" id="page-functions">
  <div class="eyebrow">Section 03</div>
  <h1>Functions in TypeScript</h1>
  <p class="subtitle">Har AI agent action ek function hai — runAgent, callGemini, executeTool. Function signatures hi tumhe batati hain ki data kis direction flow kar raha hai.</p>

  <div class="hing"><b>Hinglish:</b> Function signature ek "invoice" ki tarah hai — kya-kya lag raha hai (parameters) aur end mein kya milega (return type), sab pehle se clear.</div>

  <pre><code><span class="cm">// parameter types + return type</span>
<span class="kw">function</span> <span class="fn">executeTool</span>(name<span class="ty">: string</span>, args<span class="ty">: Record&lt;string, unknown&gt;</span>)<span class="ty">: Promise&lt;string&gt;</span> {
  <span class="cm">// ...</span>
}

<span class="cm">// optional param (?) must come after required ones</span>
<span class="kw">function</span> <span class="fn">runAgent</span>(goal<span class="ty">: string</span>, maxSteps<span class="ty">?: number</span>) {
  <span class="kw">const</span> steps = maxSteps ?? <span class="num">10</span>; <span class="cm">// default via fallback</span>
}

<span class="cm">// default parameter — cleaner than the ?? pattern above</span>
<span class="kw">function</span> <span class="fn">runAgentV2</span>(goal<span class="ty">: string</span>, maxSteps<span class="ty">: number</span> = <span class="num">10</span>) {}

<span class="cm">// callback typing</span>
<span class="kw">function</span> <span class="fn">onToolResult</span>(cb<span class="ty">: (result: string) =&gt; void</span>)<span class="ty">: void</span> {}

<span class="cm">// async function — always returns a Promise&lt;T&gt;</span>
<span class="kw">async function</span> <span class="fn">callGemini</span>(prompt<span class="ty">: string</span>)<span class="ty">: Promise&lt;string&gt;</span> {
  <span class="kw">const</span> res = <span class="kw">await</span> model.generateContent(prompt);
  <span class="kw">return</span> res.response.text();
}</code></pre>

  <h3>Function overloads (you'll see this in agent/tool dispatchers)</h3>
  <pre><code><span class="cm">// overload signatures — describe every valid "shape" of call</span>
<span class="kw">function</span> <span class="fn">createTool</span>(name<span class="ty">: string</span>)<span class="ty">: BaseTool</span>;
<span class="kw">function</span> <span class="fn">createTool</span>(name<span class="ty">: string</span>, config<span class="ty">: ToolConfig</span>)<span class="ty">: ExecutableTool</span>;
<span class="cm">// implementation signature — handles both, must be compatible with both above</span>
<span class="kw">function</span> <span class="fn">createTool</span>(name<span class="ty">: string</span>, config<span class="ty">?: ToolConfig</span>) {
  <span class="kw">return</span> config ? { name, ...config, execute(){} } : { name };
}</code></pre>
  <p>Overloads bolte hain "yeh function alag-alag argument combinations ke saath alag return types deta hai" — CLI command parsers aur tool factories mein common hai.</p>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>Bina function typing ke, "yeh function kya expect karta hai" sirf usko padhkar hi pata chalta — types se editor khud bata deta hai.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">agent/runAgent.ts</code>, <code class="inline">ai/geminiService.ts</code>, <code class="inline">tools/*.ts</code></p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><ul><li>Async function ka return type <code class="inline">Promise&lt;T&gt;</code> na likh kar sirf <code class="inline">T</code> likh dena</li><li>Optional params ko required params se pehle rakhna (invalid)</li></ul></div>
  </div>

  ${footerNav(3)}
</section>

<!-- 04 ADVANCED -->
<section class="page" id="page-advanced">
  <div class="eyebrow">Section 04</div>
  <h1>Generics & Utility Types</h1>
  <p class="subtitle">Generics tumhe "type ka variable" dete hain — same code, different types ke saath reusable. Yeh AI agent projects mein <b>har jagah</b> milega: tool results, API wrappers, memory stores.</p>

  <div class="hing"><b>Hinglish:</b> Generic ko socho ek function ki tarah, par types ke liye. Jaise <code class="inline">function identity(x) { return x }</code> kisi bhi value ko le sakta hai, waise <code class="inline">Box&lt;T&gt;</code> kisi bhi type ko "wrap" kar sakta hai — bas type record rehta hai.</p></div>

  <h3>Generic functions</h3>
  <pre><code><span class="kw">function</span> <span class="fn">wrapToolResult</span>&lt;<span class="ty">T</span>&gt;(data<span class="ty">: T</span>)<span class="ty">: { success: true; data: T }</span> {
  <span class="kw">return</span> { success<span class="ty">:</span> <span class="kw">true</span>, data };
}

<span class="kw">const</span> r1 = wrapToolResult(<span class="str">"file created"</span>); <span class="cm">// T inferred as string</span>
<span class="kw">const</span> r2 = wrapToolResult({ rows<span class="ty">:</span> <span class="num">3</span> }); <span class="cm">// T inferred as { rows: number }</span></code></pre>

  <h3>Generic interfaces</h3>
  <pre><code><span class="kw">interface</span> ApiResult&lt;<span class="ty">T</span>&gt; {
  success<span class="ty">: boolean</span>;
  data<span class="ty">?: T</span>;
  error<span class="ty">?: string</span>;
}

<span class="cm">// used across the whole app with different payload types:</span>
<span class="kw">type</span> UserResult = ApiResult&lt;User&gt;;
<span class="kw">type</span> ToolResult = ApiResult&lt;<span class="ty">string</span>&gt;;</code></pre>

  <h3>The utility types you'll actually see in production</h3>
  <table>
    <tr><th>Utility</th><th>What it does</th><th>Where it appears</th></tr>
    <tr><td><code class="inline">Partial&lt;T&gt;</code></td><td>Makes all properties optional</td><td><code class="inline">function updateConfig(patch: Partial&lt;AgentConfig&gt;)</code> — updating only some fields</td></tr>
    <tr><td><code class="inline">Pick&lt;T,K&gt;</code></td><td>Selects a subset of properties</td><td><code class="inline">Pick&lt;User, "id" | "email"&gt;</code> — public-safe user shape</td></tr>
    <tr><td><code class="inline">Omit&lt;T,K&gt;</code></td><td>Removes specific properties</td><td><code class="inline">Omit&lt;User, "password"&gt;</code> — API response DTOs</td></tr>
    <tr><td><code class="inline">Record&lt;K,V&gt;</code></td><td>Object type with known key/value types</td><td><code class="inline">Record&lt;string, ExecutableTool&gt;</code> — tool registry lookup</td></tr>
    <tr><td><code class="inline">Required&lt;T&gt;</code></td><td>Makes all properties required</td><td>Validated config after defaults have been filled in</td></tr>
    <tr><td><code class="inline">ReturnType&lt;F&gt;</code></td><td>Extracts a function's return type</td><td><code class="inline">ReturnType&lt;typeof callGemini&gt;</code> — reuse a type without re-declaring it</td></tr>
  </table>

  <pre><code><span class="cm">// Tool registry — a very common orbital-cli-style pattern:</span>
<span class="kw">const</span> toolRegistry<span class="ty">: Record&lt;string, ExecutableTool&gt;</span> = {
  readFile: { name<span class="ty">:</span> <span class="str">"readFile"</span>, description<span class="ty">:</span> <span class="str">"..."</span>, execute<span class="ty">:</span> ... },
  runShell: { name<span class="ty">:</span> <span class="str">"runShell"</span>, description<span class="ty">:</span> <span class="str">"..."</span>, execute<span class="ty">:</span> ... },
};</code></pre>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>Bina generics ke, tumhe har type ke liye alag-alag duplicate function/interface likhna padta.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p>API wrapper functions, tool registries (<code class="inline">Record&lt;&gt;</code>), config update functions (<code class="inline">Partial&lt;&gt;</code>).</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><ul><li><code class="inline">Partial&lt;T&gt;</code> use karke bhi runtime pe required fields assume kar lena (types compile-time hi hain, runtime data ko validate nahi karte)</li></ul></div>
  </div>

  ${footerNav(4)}
</section>

<!-- 05 CLASSES -->
<section class="page" id="page-classes">
  <div class="eyebrow">Section 05</div>
  <h1>Classes & Object-Oriented TypeScript</h1>
  <p class="subtitle">Services (AIService, DatabaseService, ToolService) almost hamesha classes hoti hain — kyunki inke paas state (config, connections) hoti hai jo methods share karte hain.</p>

  <div class="hing"><b>Hinglish:</b> Access modifiers batate hain "yeh property/method kaun use kar sakta hai" — <code class="inline">public</code> = sabke liye, <code class="inline">private</code> = sirf isi class ke andar, <code class="inline">protected</code> = isi class + isko extend karne waali classes ke liye.</div>

  <pre><code><span class="kw">abstract class</span> BaseService {
  <span class="kw">protected readonly</span> serviceName<span class="ty">: string</span>;

  <span class="kw">constructor</span>(name<span class="ty">: string</span>) {
    <span class="kw">this</span>.serviceName = name;
  }

  <span class="kw">abstract</span> <span class="fn">connect</span>()<span class="ty">: Promise&lt;void&gt;</span>; <span class="cm">// subclasses MUST implement this</span>
}

<span class="kw">class</span> AIService <span class="kw">extends</span> BaseService <span class="kw">implements</span> ITextGenerator {
  <span class="kw">private</span> apiKey<span class="ty">: string</span>;         <span class="cm">// only accessible inside AIService</span>
  <span class="kw">public</span> model<span class="ty">: string</span> = <span class="str">"gemini-1.5-flash"</span>; <span class="cm">// "public" is the default; often omitted</span>

  <span class="kw">constructor</span>(apiKey<span class="ty">: string</span>) {
    <span class="kw">super</span>(<span class="str">"AIService"</span>);
    <span class="kw">this</span>.apiKey = apiKey;
  }

  <span class="kw">async</span> <span class="fn">connect</span>()<span class="ty">: Promise&lt;void&gt;</span> { <span class="cm">/* implements the abstract method */</span> }

  <span class="kw">async</span> <span class="fn">generate</span>(prompt<span class="ty">: string</span>)<span class="ty">: Promise&lt;string&gt;</span> {
    <span class="kw">return</span> <span class="str">"..."</span>;
  }
}</code></pre>

  <table>
    <tr><th>Keyword</th><th>Meaning</th></tr>
    <tr><td><code class="inline">public</code></td><td>Accessible from anywhere (default if omitted)</td></tr>
    <tr><td><code class="inline">private</code></td><td>Accessible only inside this exact class</td></tr>
    <tr><td><code class="inline">protected</code></td><td>Accessible inside this class + subclasses</td></tr>
    <tr><td><code class="inline">readonly</code></td><td>Can be set once (constructor), never reassigned after</td></tr>
    <tr><td><code class="inline">abstract</code></td><td>Class/method with no implementation — must be extended/implemented</td></tr>
    <tr><td><code class="inline">implements</code></td><td>"This class promises to match this interface's shape"</td></tr>
  </table>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>Services ke paas internal state hoti hai (DB connection, API key) jo bahar se accidentally touch nahi honi chahiye — <code class="inline">private</code>/<code class="inline">protected</code> yeh guarantee karte hain.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">services/AIService.ts</code>, <code class="inline">services/DatabaseService.ts</code>, <code class="inline">services/ToolService.ts</code></p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><ul><li><code class="inline">abstract</code> class ko directly <code class="inline">new</code> karne ki koshish (allowed nahi)</li><li><code class="inline">implements</code> ko <code class="inline">extends</code> samajh lena — implements sirf shape check karta hai, code inherit nahi karta</li></ul></div>
  </div>

  ${footerNav(5)}
</section>

<!-- 06 MODULES -->
<section class="page" id="page-modules">
  <div class="eyebrow">Section 06</div>
  <h1>Modules & Project Structure</h1>
  <p class="subtitle">Yeh section pure JS knowledge hi hai (import/export), bas TS ke <code class="inline">tsconfig.json</code> aur type-only imports ke saath.</p>

  <pre><code><span class="cm">// named export</span>
<span class="kw">export</span> <span class="kw">interface</span> Tool { name<span class="ty">: string</span>; }
<span class="kw">export function</span> <span class="fn">createAgent</span>() {}

<span class="cm">// default export</span>
<span class="kw">export default class</span> AIService {}

<span class="cm">// importing both kinds</span>
<span class="kw">import</span> AIService <span class="kw">from</span> <span class="str">"./services/AIService"</span>;
<span class="kw">import</span> { Tool, createAgent } <span class="kw">from</span> <span class="str">"./agent/types"</span>;

<span class="cm">// type-only import — erased completely at compile time, zero runtime cost</span>
<span class="kw">import type</span> { AgentConfig } <span class="kw">from</span> <span class="str">"./types"</span>;</code></pre>

  <h3>Barrel files (an <code class="inline">index.ts</code> that re-exports)</h3>
  <pre><code><span class="cm">// tools/index.ts — a "barrel" that collects every tool into one import</span>
<span class="kw">export</span> * <span class="kw">from</span> <span class="str">"./readFile"</span>;
<span class="kw">export</span> * <span class="kw">from</span> <span class="str">"./runShell"</span>;
<span class="kw">export</span> * <span class="kw">from</span> <span class="str">"./webSearch"</span>;

<span class="cm">// now anywhere else in the app:</span>
<span class="kw">import</span> { readFileTool, runShellTool } <span class="kw">from</span> <span class="str">"./tools"</span>; <span class="cm">// not "./tools/readFile"</span></code></pre>

  <h3>A typical project layout</h3>
  <pre><code>src/
 ├── agent/       <span class="cm">// runAgent(), agent loop, planning logic</span>
 ├── tools/       <span class="cm">// individual tool definitions + barrel index.ts</span>
 ├── services/    <span class="cm">// AIService, DatabaseService, ToolService (classes)</span>
 ├── database/    <span class="cm">// Prisma client, repositories</span>
 ├── auth/        <span class="cm">// OAuth, sessions, tokens</span>
 ├── types/        <span class="cm">// shared interfaces/type aliases</span>
 └── index.ts     <span class="cm">// CLI entry point</span></code></pre>

  <h3>tsconfig.json — the settings that actually matter here</h3>
  <pre><code>{
  <span class="str">"compilerOptions"</span>: {
    <span class="str">"target"</span>: <span class="str">"ES2022"</span>,        <span class="cm">// what JS version to compile down to</span>
    <span class="str">"module"</span>: <span class="str">"NodeNext"</span>,      <span class="cm">// how imports/exports are compiled for Node</span>
    <span class="str">"strict"</span>: <span class="kw">true</span>,             <span class="cm">// turns on strictNullChecks + more, all at once</span>
    <span class="str">"esModuleInterop"</span>: <span class="kw">true</span>,   <span class="cm">// lets you "import express from 'express'" cleanly</span>
    <span class="str">"outDir"</span>: <span class="str">"./dist"</span>,        <span class="cm">// where compiled .js files go</span>
    <span class="str">"rootDir"</span>: <span class="str">"./src"</span>
  }
}</code></pre>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p><code class="inline">tsconfig.json</code> compiler ko batata hai kitna strict hona hai aur output kaisa dikhna chahiye.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p>Root-level <code class="inline">tsconfig.json</code>, plus one <code class="inline">index.ts</code> per folder acting as a barrel.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><ul><li>Relative import paths galat likhna (<code class="inline">.js</code> extension chahiye ho sakti hai depending on <code class="inline">module</code> setting)</li><li>Runtime value ko <code class="inline">import type</code> se import karne ki koshish (fails — types-only!)</li></ul></div>
  </div>

  ${footerNav(6)}
</section>

<!-- 07 NODE -->
<section class="page" id="page-node">
  <div class="eyebrow">Section 07</div>
  <h1>TypeScript with Node.js (this is a CLI)</h1>
  <p class="subtitle">CLI apps Node ke built-in modules (fs, path, process, child_process) ko bahut use karte hain — inko type karna thoda alag hai kyunki types <code class="inline">@types/node</code> package se aate hain, JS runtime se nahi.</p>

  <div class="hing"><b>Hinglish:</b> Node khud toh JS mein likha hai, isliye uske types "official" TypeScript ke saath nahi aate — ek separate npm package <code class="inline">@types/node</code> install karna padta hai jo <code class="inline">fs</code>, <code class="inline">path</code>, <code class="inline">process</code> sabke type definitions deta hai.</div>

  <pre><code><span class="cm">// process.env — every value is "string | undefined" by default</span>
<span class="kw">const</span> apiKey<span class="ty">: string | undefined</span> = process.env.GEMINI_API_KEY;

<span class="kw">if</span> (!apiKey) {
  <span class="kw">throw new</span> Error(<span class="str">"GEMINI_API_KEY is not set"</span>); <span class="cm">// narrows it to "string" below</span>
}
<span class="cm">// after the guard above, apiKey is typed as "string" for the rest of the function</span>

<span class="cm">// fs module — typed, promise-based API is cleanest for async code</span>
<span class="kw">import</span> { readFile } <span class="kw">from</span> <span class="str">"node:fs/promises"</span>;
<span class="kw">const</span> content<span class="ty">: string</span> = <span class="kw">await</span> readFile(<span class="str">"./config.json"</span>, <span class="str">"utf-8"</span>);

<span class="cm">// path module</span>
<span class="kw">import</span> path <span class="kw">from</span> <span class="str">"node:path"</span>;
<span class="kw">const</span> configPath<span class="ty">: string</span> = path.join(process.cwd(), <span class="str">"orbital.config.json"</span>);

<span class="cm">// child_process — running a shell command as a tool</span>
<span class="kw">import</span> { exec } <span class="kw">from</span> <span class="str">"node:child_process"</span>;
<span class="kw">import</span> { promisify } <span class="kw">from</span> <span class="str">"node:util"</span>;
<span class="kw">const</span> execAsync = promisify(exec);
<span class="kw">const</span> { stdout }<span class="ty">: { stdout: string; stderr: string }</span> = <span class="kw">await</span> execAsync(<span class="str">"ls -la"</span>);

<span class="cm">// CLI args — process.argv is always string[]</span>
<span class="kw">const</span> args<span class="ty">: string[]</span> = process.argv.slice(<span class="num">2</span>);
<span class="kw">const</span> command<span class="ty">: string | undefined</span> = args[<span class="num">0</span>];</code></pre>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>CLI tools sirf console.log wale scripts nahi — file system, subprocesses, env vars sab type-safe tarike se handle karne hote hain.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">config.js/ts</code>, entry point <code class="inline">index.ts</code>, koi bhi tool jo shell command chalata hai.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><ul><li><code class="inline">process.env.X</code> ko directly <code class="inline">string</code> maan lena, jabki woh actually <code class="inline">string | undefined</code> hai</li></ul></div>
  </div>

  ${footerNav(7)}
</section>

<!-- 08 ERRORS -->
<section class="page" id="page-errors">
  <div class="eyebrow">Section 08</div>
  <h1>Error Handling in TypeScript</h1>
  <p class="subtitle">TS mein <code class="inline">catch</code> block ka error hamesha <code class="inline">unknown</code> type ka hota hai (modern TS default) — JS ki tarah blindly <code class="inline">error.message</code> access nahi kar sakte.</p>

  <div class="diffwrap">
    <div class="diffcol bad">
      <div class="diffhead bad">JS habit — breaks in strict TS</div>
      <pre><code><span class="kw">try</span> {
  <span class="kw">await</span> callGemini(prompt);
} <span class="kw">catch</span> (error) {
  console.log(error.message); <span class="cm">// error is 'unknown' —</span>
                               <span class="cm">// Property 'message' does not exist</span>
}</code></pre>
    </div>
    <div class="diffcol good">
      <div class="diffhead good">TS-safe way</div>
      <pre><code><span class="kw">try</span> {
  <span class="kw">await</span> callGemini(prompt);
} <span class="kw">catch</span> (error) {
  <span class="kw">if</span> (error <span class="kw">instanceof</span> Error) {
    console.log(error.message); <span class="cm">// safe — narrowed to Error</span>
  } <span class="kw">else</span> {
    console.log(<span class="str">"Unknown error"</span>, error);
  }
}</code></pre>
    </div>
  </div>

  <h3>Custom error classes (very common in agent/tool code)</h3>
  <pre><code><span class="kw">class</span> ToolExecutionError <span class="kw">extends</span> Error {
  <span class="kw">constructor</span>(
    <span class="kw">public readonly</span> toolName<span class="ty">: string</span>,
    message<span class="ty">: string</span>
  ) {
    <span class="kw">super</span>(message);
    <span class="kw">this</span>.name = <span class="str">"ToolExecutionError"</span>;
  }
}

<span class="kw">try</span> {
  <span class="kw">await</span> tool.execute(args);
} <span class="kw">catch</span> (error) {
  <span class="kw">throw new</span> ToolExecutionError(tool.name, <span class="str">"Tool failed to run"</span>);
}</code></pre>
  <p>(Notice the shorthand: <code class="inline">public readonly toolName: string</code> directly in the constructor params — TS declares AND assigns the property in one line. This is very common and can look confusing the first time you see it.)</p>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>Runtime pe "kuch bhi" throw ho sakta hai (string, number, object) — <code class="inline">unknown</code> tumhe assume karne se rokta hai ki woh hamesha <code class="inline">Error</code> hoga.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p>Har jagah jahan external calls hain — Gemini API, DB queries, tool execution, file I/O.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><p><code class="inline">catch (error: any)</code> likh kar type-checking hi skip kar dena, instead of narrowing with <code class="inline">instanceof</code>.</p></div>
  </div>

  ${footerNav(8)}
</section>

<!-- 09 THIRD PARTY -->
<section class="page" id="page-thirdparty">
  <div class="eyebrow">Section 09</div>
  <h1>Third-Party Library Typing</h1>
  <p class="subtitle">Har npm package apne saath types nahi laata. Yeh section batata hai types kahan se aate hain.</p>

  <table>
    <tr><th>Situation</th><th>What you do</th></tr>
    <tr><td>Package ships its own types (e.g. <code class="inline">zod</code>, <code class="inline">@google/generative-ai</code>)</td><td>Bas normal <code class="inline">import</code> karo — types automatically milte hain.</td></tr>
    <tr><td>Popular package, no built-in types (e.g. older <code class="inline">express</code> versions)</td><td><code class="inline">npm i -D @types/express</code> — community-maintained types (DefinitelyTyped).</td></tr>
    <tr><td>No types anywhere available</td><td>Apna declaration file likho: <code class="inline">declare module "some-lib"</code></td></tr>
  </table>

  <pre><code><span class="cm">// custom declaration file: types/some-lib.d.ts</span>
<span class="kw">declare module</span> <span class="str">"untyped-lib"</span> {
  <span class="kw">export function</span> <span class="fn">doThing</span>(input<span class="ty">: string</span>)<span class="ty">: number</span>;
}

<span class="cm">// now this import is typed, even though the library itself has no types:</span>
<span class="kw">import</span> { doThing } <span class="kw">from</span> <span class="str">"untyped-lib"</span>;</code></pre>

  <p>Typing an external API's response manually (jab koi SDK types nahi deta):</p>
  <pre><code><span class="kw">interface</span> GeminiApiResponse {
  candidates<span class="ty">: {</span>
    <span class="ty">content: { parts: { text: string }[] };</span>
  <span class="ty">}[]</span>;
}

<span class="kw">async function</span> <span class="fn">rawGeminiCall</span>(prompt<span class="ty">: string</span>)<span class="ty">: Promise&lt;GeminiApiResponse&gt;</span> {
  <span class="kw">const</span> res = <span class="kw">await</span> fetch(<span class="str">"https://.../generateContent"</span>, { <span class="cm">/* ... */</span> });
  <span class="kw">return</span> res.json() <span class="kw">as</span> GeminiApiResponse; <span class="cm">// "as" = type assertion — you're telling TS, trust me</span>
}</code></pre>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>TS type system sirf usi code ko dekhta hai jo usne khud compile kiya — external JS libraries ke liye extra type info chahiye hoti hai.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">package.json</code> devDependencies mein <code class="inline">@types/*</code> entries, koi <code class="inline">*.d.ts</code> files.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><p><code class="inline">as</code> (type assertion) ko overuse karna — yeh runtime check nahi karta, sirf TS ko "chup karwa deta hai". Galat use karne pe runtime crash chhupa sakta hai.</p></div>
  </div>

  ${footerNav(9)}
</section>

<!-- 10 AI AGENT PATTERNS -->
<section class="page" id="page-aiagent">
  <div class="eyebrow">Section 10 / Where everything comes together</div>
  <h1>TypeScript Patterns in AI Agent Projects</h1>
  <p class="subtitle">Yeh section pichle sab concepts ko combine karta hai — jo tumhe <b>actually</b> orbital-cli-dev jaise repo mein milega.</p>

  <h3>Typing a Tool (the shape you listed)</h3>
  <pre><code><span class="kw">interface</span> Tool&lt;<span class="ty">TArgs</span> = <span class="ty">Record&lt;string, unknown&gt;</span>&gt; {
  name<span class="ty">: string</span>;
  description<span class="ty">: string</span>;
  <span class="fn">execute</span>(args<span class="ty">: TArgs</span>)<span class="ty">: Promise&lt;string&gt;</span>;
}

<span class="kw">const</span> readFileTool<span class="ty">: Tool&lt;{ path: string }&gt;</span> = {
  name<span class="ty">:</span> <span class="str">"read_file"</span>,
  description<span class="ty">:</span> <span class="str">"Reads a file from disk"</span>,
  <span class="kw">async</span> <span class="fn">execute</span>({ path }) {
    <span class="kw">return</span> <span class="kw">await</span> readFile(path, <span class="str">"utf-8"</span>);
  },
};</code></pre>

  <h3>Typing an Agent</h3>
  <pre><code><span class="kw">interface</span> Agent {
  goal<span class="ty">: string</span>;
  tools<span class="ty">: Tool[]</span>;
  memory<span class="ty">: ChatMessage[]</span>;
  <span class="fn">run</span>()<span class="ty">: Promise&lt;string&gt;</span>;
}</code></pre>

  <h3>Zod — validating AI output at runtime (types alone aren't enough here)</h3>
  <p><b>Important idea:</b> TypeScript types <i>disappear</i> after compilation — they can't check data that arrives at runtime (like an LLM's JSON output). <b>Zod</b> is a library that defines a schema once and gives you both a runtime validator <i>and</i> a TS type — for free.</p>
  <pre><code><span class="kw">import</span> { z } <span class="kw">from</span> <span class="str">"zod"</span>;

<span class="kw">const</span> ToolCallSchema = z.object({
  toolName: z.string(),
  args: z.record(z.unknown()),
});

<span class="cm">// derive the TS type FROM the schema — no duplication</span>
<span class="kw">type</span> ToolCall = z.infer&lt;<span class="kw">typeof</span> ToolCallSchema&gt;;

<span class="kw">function</span> <span class="fn">parseModelOutput</span>(raw<span class="ty">: unknown</span>)<span class="ty">: ToolCall</span> {
  <span class="kw">return</span> ToolCallSchema.parse(raw); <span class="cm">// throws at runtime if the LLM's JSON is malformed</span>
}</code></pre>
  <p>Yeh pattern <b>bahut common hai</b> AI agent codebases mein: LLM se JSON string aata hai → Zod se validate/parse karo → ab tumhe ek type-safe object mil gaya jispe TS bhi bharosa kar sakta hai.</p>

  <h3>Structured output / function-calling schema</h3>
  <pre><code><span class="kw">interface</span> FunctionSchema {
  name<span class="ty">: string</span>;
  description<span class="ty">: string</span>;
  parameters<span class="ty">: {</span>
    <span class="ty">type: "object";</span>
    <span class="ty">properties: Record&lt;string, { type: string; description: string }&gt;;</span>
    <span class="ty">required: string[];</span>
  <span class="ty">}</span>;
}</code></pre>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>LLM output text hai — TS compile-time type system usse guarantee nahi kar sakta. Zod runtime bridge banata hai.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">agent/schemas.ts</code>, tool definitions, anywhere the model's raw JSON gets parsed.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><p>Model ke JSON output ko directly <code class="inline">JSON.parse(...) as MyType</code> karna bina Zod/runtime validation ke — TS "as" sirf pretend karta hai, actual check nahi karta.</p></div>
  </div>

  ${footerNav(10)}
</section>

<!-- 11 PRISMA -->
<section class="page" id="page-prisma">
  <div class="eyebrow">Section 11</div>
  <h1>Prisma + TypeScript</h1>
  <p class="subtitle">Prisma ek ORM hai jo tumhare <code class="inline">schema.prisma</code> file se <b>automatically</b> TS types generate karta hai — yeh types tumhare DB schema se hamesha sync rehte hain.</p>

  <pre><code><span class="cm">// schema.prisma</span>
model User {
  id            String         @id @default(cuid())
  email         String         @unique
  conversations Conversation[]
}

model Conversation {
  id       String    @id @default(cuid())
  userId   String
  user     User      @relation(fields: [userId], references: [id])
  messages Message[]
}

model Message {
  id             String       @id @default(cuid())
  role           String
  content        String
  conversationId String
}</code></pre>

  <p><code class="inline">npx prisma generate</code> chalane pe, Prisma khud <code class="inline">User</code>, <code class="inline">Conversation</code>, <code class="inline">Message</code> types bana deta hai — tumhe manually interface likhne ki zaroorat nahi.</p>

  <pre><code><span class="kw">import</span> { PrismaClient } <span class="kw">from</span> <span class="str">"@prisma/client"</span>;
<span class="kw">const</span> prisma = <span class="kw">new</span> PrismaClient();

<span class="cm">// fully type-checked query — typo a field name and TS catches it immediately</span>
<span class="kw">const</span> user = <span class="kw">await</span> prisma.user.findUnique({
  where: { email<span class="ty">:</span> <span class="str">"dev@orbital.ai"</span> },
  include: { conversations: <span class="kw">true</span> }, <span class="cm">// relation — result type includes conversations[]</span>
});
<span class="cm">// TS knows: user could be null, and if not null, has a .conversations array</span></code></pre>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>DB schema aur code ke types manually sync rakhna error-prone hai — Prisma isse automate kar deta hai.</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">prisma/schema.prisma</code>, <code class="inline">database/</code> folder, generated types in <code class="inline">node_modules/.prisma/client</code>.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><p>Schema change karne ke baad <code class="inline">npx prisma generate</code> bhoolna — purane types dikhte rehte hain editor mein.</p></div>
  </div>

  ${footerNav(11)}
</section>

<!-- 12 AUTH -->
<section class="page" id="page-auth">
  <div class="eyebrow">Section 12</div>
  <h1>Authentication Code Patterns</h1>
  <p class="subtitle">Auth code mein zyadatar wahi patterns repeat hote hain jo tum abhi seekh chuke ho — bas ek specific context mein.</p>

  <pre><code><span class="kw">interface</span> SessionUser {
  id<span class="ty">: string</span>;
  email<span class="ty">: string</span>;
}

<span class="kw">interface</span> TokenPayload {
  sub<span class="ty">: string</span>;       <span class="cm">// user id</span>
  exp<span class="ty">: number</span>;      <span class="cm">// expiry timestamp</span>
}

<span class="kw">interface</span> OAuthConfig {
  clientId<span class="ty">: string</span>;
  clientSecret<span class="ty">: string</span>;
  redirectUri<span class="ty">: string</span>;
  scopes<span class="ty">: string[]</span>;
}

<span class="kw">function</span> <span class="fn">verifyToken</span>(token<span class="ty">: string</span>)<span class="ty">: TokenPayload | null</span> {
  <span class="kw">try</span> {
    <span class="kw">return</span> jwt.verify(token, process.env.JWT_SECRET<span class="kw">!</span>) <span class="kw">as</span> TokenPayload;
    <span class="cm">// the "!" = non-null assertion: "I promise this env var exists"</span>
    <span class="cm">// (risky — prefer an explicit check instead, see Section 07)</span>
  } <span class="kw">catch</span> {
    <span class="kw">return</span> <span class="kw">null</span>;
  }
}</code></pre>

  <p>Yeh sirf Sections 01–08 ke concepts hi hain, ek "auth" context mein: interfaces (config, payload shapes), <code class="inline">| null</code> unions, error handling, <code class="inline">process.env</code> typing. Naya kuch nahi hai — sirf recognize karna hai.</p>

  <div class="cardrow">
    <div class="card why"><div class="clabel">Why exists</div><p>Token/session data galat shape mein hone se security bugs ban sakte hain — types ek pehli layer of defense hain (runtime validation ke saath, akela nahi).</p></div>
    <div class="card where"><div class="clabel">Where in repo</div><p><code class="inline">auth/</code> folder — OAuth handlers, session middleware, token utils.</p></div>
    <div class="card mistake"><div class="clabel">Common mistake</div><p>Non-null assertion (<code class="inline">!</code>) ko habit bana lena har jagah "TS ko chup karwane" ke liye — yeh guarantee nahi karta value actually exist karti hai.</p></div>
  </div>

  ${footerNav(12)}
</section>

<!-- 13 CHEAT SHEET -->
<section class="page" id="page-cheatsheet">
  <div class="eyebrow">Section 13</div>
  <h1>TypeScript Cheat Sheet — orbital-cli edition</h1>
  <p class="subtitle">Repo padhte waqt tab ke liye khula rakhne wali quick-reference.</p>

  <table>
    <tr><th>Syntax</th><th>Meaning</th></tr>
    <tr><td><code class="inline">let x: string</code></td><td>Type annotation</td></tr>
    <tr><td><code class="inline">x?: string</code></td><td>Optional property (could be undefined)</td></tr>
    <tr><td><code class="inline">readonly x</code></td><td>Set once, never reassigned</td></tr>
    <tr><td><code class="inline">A | B</code></td><td>Union — value is A OR B</td></tr>
    <tr><td><code class="inline">A & B</code></td><td>Intersection — value must satisfy A AND B</td></tr>
    <tr><td><code class="inline">interface X { }</code></td><td>Describes an object shape</td></tr>
    <tr><td><code class="inline">type X = ...</code></td><td>Names any type (object, union, primitive)</td></tr>
    <tr><td><code class="inline">extends</code></td><td>Interface inherits another interface's shape / class inherits a class</td></tr>
    <tr><td><code class="inline">implements</code></td><td>Class promises to match an interface's shape</td></tr>
    <tr><td><code class="inline">&lt;T&gt;</code></td><td>Generic — a placeholder type, filled in at use-time</td></tr>
    <tr><td><code class="inline">Promise&lt;T&gt;</code></td><td>Async function's eventual resolved type</td></tr>
    <tr><td><code class="inline">unknown</code></td><td>Could be anything — must narrow before use</td></tr>
    <tr><td><code class="inline">any</code></td><td>Type checking off — avoid</td></tr>
    <tr><td><code class="inline">never</code></td><td>Function never returns normally (always throws/loops)</td></tr>
    <tr><td><code class="inline">void</code></td><td>Function returns nothing meaningful</td></tr>
    <tr><td><code class="inline">as X</code></td><td>Type assertion — "trust me", no runtime check</td></tr>
    <tr><td><code class="inline">x!</code></td><td>Non-null assertion — "I promise this isn't null/undefined"</td></tr>
    <tr><td><code class="inline">x?.y</code></td><td>Optional chaining — safely access, yields undefined if x is null</td></tr>
    <tr><td><code class="inline">x ?? y</code></td><td>Nullish coalescing — fallback only if x is null/undefined</td></tr>
    <tr><td><code class="inline">Partial&lt;T&gt;</code></td><td>All properties optional</td></tr>
    <tr><td><code class="inline">Pick&lt;T,K&gt;</code></td><td>Subset of properties</td></tr>
    <tr><td><code class="inline">Omit&lt;T,K&gt;</code></td><td>All except listed properties</td></tr>
    <tr><td><code class="inline">Record&lt;K,V&gt;</code></td><td>Object type: keys of K, values of V</td></tr>
    <tr><td><code class="inline">import type</code></td><td>Import erased at compile time (types only)</td></tr>
    <tr><td><code class="inline">z.infer&lt;typeof S&gt;</code></td><td>Derive a TS type from a Zod runtime schema</td></tr>
  </table>

  ${footerNav(13)}
</section>

  {front:'readonly id: string', back:'Can only be set once (usually in constructor), never reassigned.'},
  {front:'A | B', back:'Union type — the value is one of these shapes. Often paired with an if-check.'},
  {front:'A & B', back:'Intersection — the value must satisfy both shapes at once.'},
  {front:'Promise<T>', back:'Return type of an async function — resolves to a value of type T.'},
  {front:'<T>', back:'Generic placeholder — actual type is filled in wherever this is used.'},
  {front:'as SomeType', back:'Type assertion. Tells TS to trust you — no runtime check happens.'},
  {front:'value!', back:'Non-null assertion — "I promise this exists." Risky if wrong.'},
  {front:'value?.prop', back:'Optional chaining — safely reads prop, returns undefined if value is null/undefined.'},
  {front:'value ?? fallback', back:'Nullish coalescing — use fallback only if value is null or undefined.'},
  {front:'import type { X }', back:'Import used only for types — completely erased when compiled to JS.'},
  {front:'implements ITool', back:'This class promises to match the ITool interface shape.'},
  {front:'Record<string, Tool>', back:'An object where every key is a string and every value is a Tool — common for registries.'},
  {front:'z.infer<typeof Schema>', back:'Derives a TypeScript type directly from a Zod runtime schema.'},
  {front:'private apiKey', back:'Only accessible inside this exact class — not subclasses, not outside code.'},
  {front:'export default', back:"This module's single main export — imported without curly braces."},
];
